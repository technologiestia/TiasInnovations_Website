    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="toastBox" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive"

    <script>
        document.getElementById("contactForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const message = document.getElementById("message").value.trim();

            const toastBox = document.getElementById("toastBox");
            const toastMessage = document.getElementById("toastMessage");

            try {
                const response = await fetch("https://tiasinnovations.com/api/user/customerQuery", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, mobile, message })
                });

                const result = await response.json();
                const bsToast = new bootstrap.Toast(toastBox);

                if (response.ok) {
                    toastBox.classList.remove("bg-danger", "bg-warning");
                    toastBox.classList.add("bg-success");
                    toastMessage.innerHTML = `✅ ${result.message || "Your message has been sent successfully!"}`;
                    document.getElementById("contactForm").reset();
                } else {
                    toastBox.classList.remove("bg-success", "bg-warning");
                    toastBox.classList.add("bg-danger");
                    toastMessage.innerHTML = `❌ ${result.message || "Something went wrong. Please try again."}`;
                }
                bsToast.show();
            } catch (error) {
                const bsToast = new bootstrap.Toast(toastBox);
                toastBox.classList.remove("bg-success", "bg-danger");
                toastBox.classList.add("bg-warning");
                toastMessage.innerHTML = "⚠️ Failed to connect to server. Try again later.";
                bsToast.show();
            }
        });
    </script>

    <script>
        const texts = [
            "Effective Solutions for",
            "Insomnia Relief",
            "Better Sleep Naturally",
            "Ancestral Healing",
            "Emotional Wellness"
        ];

        let count = 0;
        let index = 0;
        let currentText = "";
        let letter = "";
        const typingElement = document.getElementById("typing-text");

        function type() {
            if (count === texts.length) {
                count = 0; // loop
            }
            currentText = texts[count];
            letter = currentText.slice(0, ++index);

            typingElement.textContent = letter;

            if (letter.length === currentText.length) {
                setTimeout(() => {
                    index = 0;
                    count++;
                    type();
                }, 1500); // wait before deleting/next
            } else {
                setTimeout(type, 100);
            }
        }

        type();
    </script>
